<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="ToolDrift — 国产模型 tool-call 契约回归哨兵">
  <defs>
    <linearGradient id="hl-word" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0071E3"/>
      <stop offset="0.55" stop-color="#5E5CE6"/>
      <stop offset="1" stop-color="#10A37F"/>
    </linearGradient>
    <linearGradient id="hl-sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10A37F"/>
      <stop offset="0.5" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#E5484D"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="880" height="300" rx="20" fill="#F5F5F7"/>

  <!-- left: red→green contract gate motif -->
  <g transform="translate(56,70)">
    <rect x="0" y="0" width="150" height="160" rx="16" fill="#0071E3" fill-opacity="0.08" stroke="#C9C9D0" stroke-width="1.5"/>
    <text x="75" y="26" text-anchor="middle" font-size="11" font-weight="600" fill="#6E6E73" letter-spacing="1">tool_calls</text>
    <!-- green equivalent row -->
    <g transform="translate(18,46)">
      <circle cx="8" cy="8" r="8" fill="#10A37F"/>
      <path d="M4,8 L7,11 L12,5" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="12" font-size="12" font-weight="500" fill="#0B6B53">get_weather  ✓</text>
    </g>
    <!-- red drift row -->
    <g transform="translate(18,82)">
      <circle cx="8" cy="8" r="8" fill="#E5484D"/>
      <path d="M5,5 L11,11 M11,5 L5,11" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
      <text x="26" y="12" font-size="12" font-weight="500" fill="#B42318">get_forecast ✗</text>
    </g>
    <g transform="translate(18,116)">
      <rect x="0" y="0" width="114" height="22" rx="6" fill="#E5484D" fill-opacity="0.12"/>
      <text x="57" y="15" text-anchor="middle" font-size="10.5" font-weight="600" fill="#B42318">exit 1 · drift</text>
    </g>
  </g>

  <!-- right: wordmark + tagline -->
  <g transform="translate(248,0)">
    <text x="0" y="138" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#hl-word)">ToolDrift</text>
    <rect x="2" y="158" width="430" height="4" rx="2" fill="url(#hl-sweep)"/>
    <text x="2" y="196" font-size="20" font-weight="600" fill="#1D1D1F">国产模型 tool-call 契约回归哨兵</text>
    <text x="2" y="226" font-size="14" font-weight="400" fill="#6E6E73">DeepSeek · Qwen · Kimi · GLM · MiniMax — 换模型前先在 CI 里红灯</text>
  </g>
</svg>
