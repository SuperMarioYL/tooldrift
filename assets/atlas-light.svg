<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="架构：suite.yaml → probe 两家 provider → 归一化契约快照 → diff → 红绿 CI 退出码">
  <defs>
    <marker id="ah-l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#B9B9C2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" rx="18" fill="#F5F5F7"/>

  <text x="40" y="44" font-size="15" font-weight="700" fill="#1D1D1F">ToolDrift · 单进程 CLI — 只探测、永不代理业务流量</text>

  <!-- connectors -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <!-- suite -> probe(old) and probe(new) -->
    <line x1="172" y1="120" x2="232" y2="96"  marker-end="url(#ah-l)"/>
    <line x1="172" y1="120" x2="232" y2="232" marker-end="url(#ah-l)"/>
    <!-- probe old -> snapshot old -->
    <line x1="392" y1="96"  x2="452" y2="96"  marker-end="url(#ah-l)"/>
    <!-- probe new -> snapshot new -->
    <line x1="392" y1="232" x2="452" y2="232" marker-end="url(#ah-l)"/>
    <!-- snapshots -> diff -->
    <line x1="600" y1="96"  x2="654" y2="150" marker-end="url(#ah-l)"/>
    <line x1="600" y1="232" x2="654" y2="186" marker-end="url(#ah-l)"/>
  </g>

  <!-- suite.yaml input -->
  <g>
    <rect x="32" y="86" width="140" height="68" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="102" y="116" text-anchor="middle" font-size="14" font-weight="600" fill="#0A4F9E">suite.weather.yaml</text>
    <text x="102" y="136" text-anchor="middle" font-size="11" fill="#6E6E73">prompt + 工具定义</text>
  </g>

  <!-- probe old (deepseek) -->
  <g>
    <rect x="232" y="64" width="160" height="64" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
    <text x="312" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#4B3FC4">probe · old</text>
    <text x="312" y="110" text-anchor="middle" font-size="11" fill="#6E6E73">DeepSeek /chat/completions</text>
  </g>
  <!-- probe new (qwen) -->
  <g>
    <rect x="232" y="200" width="160" height="64" rx="15" fill="#5E5CE6" fill-opacity="0.10" stroke="#5E5CE6" stroke-width="1.5"/>
    <text x="312" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#4B3FC4">probe · new</text>
    <text x="312" y="246" text-anchor="middle" font-size="11" fill="#6E6E73">Qwen /chat/completions</text>
  </g>

  <!-- snapshot old -->
  <g>
    <rect x="452" y="64" width="148" height="64" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5"/>
    <text x="526" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#0B6B53">ContractSnapshot</text>
    <text x="526" y="110" text-anchor="middle" font-size="11" fill="#6E6E73">归一化 · 落 JSON</text>
  </g>
  <!-- snapshot new -->
  <g>
    <rect x="452" y="200" width="148" height="64" rx="15" fill="#10A37F" fill-opacity="0.10" stroke="#10A37F" stroke-width="1.5"/>
    <text x="526" y="226" text-anchor="middle" font-size="13" font-weight="600" fill="#0B6B53">ContractSnapshot</text>
    <text x="526" y="246" text-anchor="middle" font-size="11" fill="#6E6E73">归一化 · 落 JSON</text>
  </g>

  <!-- diff -->
  <g>
    <rect x="654" y="132" width="100" height="72" rx="15" fill="#0071E3" fill-opacity="0.10" stroke="#0071E3" stroke-width="1.5"/>
    <text x="704" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0A4F9E">diff()</text>
    <text x="704" y="186" text-anchor="middle" font-size="10.5" fill="#6E6E73">纯函数 · 逐字段</text>
  </g>

  <!-- red/green CI exit -->
  <g stroke="#C9C9D0" stroke-width="1.5" fill="none">
    <line x1="754" y1="168" x2="800" y2="168" marker-end="url(#ah-l)"/>
  </g>
  <g>
    <rect x="788" y="86" width="60" height="38" rx="10" fill="#10A37F" fill-opacity="0.14" stroke="#10A37F" stroke-width="1.5"/>
    <text x="818" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#0B6B53">✓ 0</text>
    <rect x="788" y="210" width="60" height="38" rx="10" fill="#E5484D" fill-opacity="0.14" stroke="#E5484D" stroke-width="1.5"/>
    <text x="818" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#B42318">✗ 1</text>
    <line x1="818" y1="124" x2="818" y2="210" stroke="#C9C9D0" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="818" y="178" text-anchor="middle" font-size="10.5" font-weight="600" fill="#6E6E73">CI exit</text>
  </g>

  <!-- footnote: fields normalized -->
  <text x="40" y="328" font-size="11.5" fill="#6E6E73">归一化字段：arg_keys · arg_nesting · arguments_encoding(object|json_string) · parallel_arity · tool_call_id_format · finish_reason</text>
</svg>
