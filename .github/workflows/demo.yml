name: demo

# Manual-only: the committed assets/demo.gif is the source of truth. Run this
# workflow by hand (Actions → demo → Run workflow) to re-render it from
# docs/demo.tape. It is NOT triggered on tag push, so a release can never be
# blocked by a flaky demo render.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tape drives the real `tooldrift` binary, so install the package first.
      - name: Install tooldrift
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Install vhs + its deps deterministically from the charm apt repo + ubuntu.
      # (charmbracelet/vhs-action@v2 self-installs ffmpeg and that step is flaky on
      # current runners — "Failed to install ffmpeg" — so we install everything via
      # apt instead and call vhs directly.)
      - name: Install vhs + ttyd + ffmpeg
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
            | sudo tee /etc/apt/sources.list.d/charm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y vhs ttyd ffmpeg

      - name: Render demo.gif
        run: vhs docs/demo.tape

      - name: Commit rendered gif
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/demo.gif
          git diff --cached --quiet && { echo "no change to demo.gif"; exit 0; }
          git commit -m "chore: render demo gif"
          git push origin HEAD:${{ github.ref_name }}
