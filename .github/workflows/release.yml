name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --wheel --outdir dist/

      - name: Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # v0.5.0 (m17): attach the built wheel/sdist/checksums to the GitHub Release.
  # upload-artifact only stores a CI artifact private to the workflow run —
  # without this job the v0.4.0 release shipped with a wheel only (uploaded
  # out-of-band) and no sdist or checksums ever reached users.
  publish:
    name: attach dist to the GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach dist to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # Optional: PyPI trusted publishing. OFF by default so a fresh repo doesn't fail
  # the release run before PyPI is set up. To enable:
  #   1. On pypi.org, add a Trusted Publisher for project "tooldrift":
  #      owner=SuperMarioYL, repo=tooldrift, workflow=release.yml, environment=pypi
  #   2. In this repo, set an Actions *variable* PYPI_PUBLISH=true
  #      (Settings → Secrets and variables → Actions → Variables).
  # Until then this job is skipped (no failed "pypi" deployment); the build job
  # above still produces the wheel/sdist artifacts.
  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Drop checksums before upload
        run: rm -f dist/checksums.txt
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
