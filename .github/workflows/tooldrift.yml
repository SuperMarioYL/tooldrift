name: tooldrift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e . pytest ruff

      - name: Lint (ruff, non-blocking)
        run: ruff check src tests || true

      - name: Test
        run: pytest -q

  contract-regression:
    name: contract regression gate (offline fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # This is the CI gate the README advertises: `tooldrift run` red-lights a
      # breaking tool-call contract swap. The shipped fixtures encode a real
      # DeepSeek -> Qwen drift, so this step is EXPECTED to fail (exit 1) — we
      # assert that it does, proving the sentinel actually trips. Swap in your
      # own equivalent providers (and drop `|| true`) to gate real migrations.
      - name: Assert drift is caught
        run: |
          if tooldrift run --old deepseek --new qwen --from-fixtures; then
            echo "::error::expected contract drift to red-light, but run exited 0"
            exit 1
          else
            echo "drift correctly red-lighted (non-zero exit) ✓"
          fi
